name: Release

# Pushing a tag like v0.1.0 automatically creates a GitHub Release.
# Packagist (once the GitHub integration is enabled) picks the new
# version up on its own — no manual "Update" clicks, no new submit.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
